name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the build reads commit dates for JSON-LD dateCreated/dateModified (src/lib/git-dates.ts).
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Astro build cache: downloaded fonts, optimized images and the content data store.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            astro-${{ runner.os }}-

      # GA4 Measurement ID (public, not a secret): repository variable PUBLIC_GA4_ID.
      # Production (main) only, so PR preview deploys on *.pages.dev do not send hits to the real property.
      - run: pnpm build
        env:
          PUBLIC_GA4_ID: ${{ github.ref == 'refs/heads/main' && vars.PUBLIC_GA4_ID || '' }}

      # Live sitemap before this deploy, so IndexNow only gets URLs that are new, removed or have a new lastmod.
      - name: Snapshot live sitemap
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow.mjs snapshot "$RUNNER_TEMP/sitemap-before.json"

      # Production deploy on main (served at buikhuongduy.com); preview deploy for PRs.
      - name: Deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy dist
            --project-name=buikhuongduy-com
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

      # Notify Bing and other IndexNow engines (not Google) about changed URLs. Never fails the deploy.
      - name: Submit changed URLs to IndexNow
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/indexnow.mjs submit "$RUNNER_TEMP/sitemap-before.json"

  # Every audited page must score 100 in all Lighthouse categories (see lighthouserc.cjs).
  # Runs in parallel with deploy; mark it as a required check to block merging regressions.
  lighthouse:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restore only: the deploy job is the single writer of this key, avoiding a parallel save race.
      - uses: actions/cache/restore@v6
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            astro-${{ runner.os }}-

      # Audit with GA4 loaded, but under a dummy ID so CI runs do not show up in the real property.
      - run: pnpm build
        env:
          PUBLIC_GA4_ID: G-LHCI000000

      - run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
