name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Astro build cache: downloaded fonts, optimized images and the content data store.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            astro-${{ runner.os }}-

      - run: pnpm build

      # Production deploy on main (served at buikhuongduy.com); preview deploy for PRs.
      - name: Deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy dist
            --project-name=buikhuongduy-com
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  # Every audited page must score 100 in all Lighthouse categories (see lighthouserc.cjs).
  # Runs in parallel with deploy; mark it as a required check to block merging regressions.
  lighthouse:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            astro-${{ runner.os }}-

      - run: pnpm build

      - run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
